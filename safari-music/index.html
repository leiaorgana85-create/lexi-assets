<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="apple-touch-icon" href="/lexi-assets/music-logo.png?v=2" />
  <title>LEXI MUSIC</title>
  <style>
    html,body{margin:0;background:#0b0b0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot strong{display:block;font-size:20px;margin-bottom:8px}
    .boot span{color:#a7a7ad;font-size:14px}
  </style>
</head>
<body>
  <div class="boot"><div><strong>LEXI MUSIC</strong><span>Opening Safari player…</span></div></div>
  <script>
    (async () => {
      try {
        const response = await fetch('/music-player/index.html?mode=safari-v3', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Lexi Music HTML returned ${response.status}`);
        let html = await response.text();

        // Safari shortcut mode only: no manifest, standalone/PWA metadata, or
        // service-worker registration. The Home Screen icon should open Safari.
        html = html.replace(/<link\s+rel=["']manifest["'][^>]*>/gi, '');
        html = html.replace(/<meta\s+name=["']apple-mobile-web-app-capable["'][^>]*>/gi, '');
        html = html.replace(/<meta\s+name=["']apple-mobile-web-app-status-bar-style["'][^>]*>/gi, '');
        html = html.replace(/<meta\s+name=["']apple-mobile-web-app-title["'][^>]*>/gi, '');
        html = html.replace(/<script>\s*window\.__musicBootStart[\s\S]*?navigator\.serviceWorker\.register\([\s\S]*?<\/script>/i,
          '<script>window.__musicBootStart = performance.now();<\/script>');

        // Preserve the Safari v3 reliability fix: do not load playback-prefetch.js,
        // which forces audio.load()/canplay gating on each source change.
        html = html.replace(/\s*<script src=["']playback-prefetch\.js\?v=3["']><\/script>\s*/i, '\n');

        // Use the canonical Lexi Music icon/title even though this is a Safari shortcut.
        html = html.replace('<head>', '<head><base href="/music-player/"><link rel="apple-touch-icon" href="/lexi-assets/music-logo.png?v=2"><title>LEXI MUSIC</title>');

        html = html.replace('<body>', '<body data-lexi-safari="1" data-safari-player-version="3">');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.body.innerHTML = '<div class="boot"><div><strong>Could not open Lexi Music</strong><span>Reload this Safari page.</span></div></div>';
      }
    })();
  </script>
</body>
</html>
